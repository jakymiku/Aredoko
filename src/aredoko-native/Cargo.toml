[package]
name = "aredoko_native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "aredoko_native"
crate-type = ["cdylib"]

[dependencies]
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
png = "0.17"
rayon = "1.10"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
