name: Aredoko production contracts (manual)
# Opt-in only. No push/pull_request/schedule triggers. Never run just for docs.
# Legacy browser/Tauri/GUI-comparison benchmarks were removed from this
# product workflow; their source and manual local launchers are preserved.
on:
  workflow_dispatch:
jobs:
  production-contracts:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production integration (generated temporary data)
        run: python -m unittest discover -s tests -p 'test_production.py' -v
      - name: Restore and rollback contracts (generated data)
        run: python -m unittest discover -s tests -p 'test_restore_switch.py' -v
      - name: Source scope/cancellation contracts
        run: python -m unittest discover -s tests -p 'test_search_cancellation.py' -v
      - name: Acquisition contracts (no actual model download)
        run: python -m unittest discover -s tests -p 'test_ai_acquisition.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core contract assertions (no native WinUI acceptance implied)
        run: dotnet run --project tests/Aredoko.Core.Tests/Aredoko.Core.Tests.csproj -c Release
