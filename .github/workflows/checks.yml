name: Prototype checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: python -m unittest discover -s experiments/gui-compare/tests -v
      - run: node --check experiments/gui-compare/tauri-react/vite.config.js
      - name: Validate comparison PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem experiments/gui-compare -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parsing failed for $($_.FullName): $($errors -join ', ')" }
          }
  browser-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Node driver
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Test real HTTP + Edge on an isolated fixture
        run: node tools/run-ui-check.cjs
      - name: Upload UI screenshots (even if the test fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-ui-smoke
          path: cache/qa/*.png
          if-no-files-found: ignore
