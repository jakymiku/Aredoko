name: AI profile GUI and restart checks
on:
  push:
    branches: [feat/winui3-production-mvp-20261011]
  pull_request:
    paths:
      - 'app/ai_settings.py'
      - 'app/production_server.py'
      - 'tests/test_ai_settings.py'
      - 'src/Aredoko.WinUI/**'
      - 'src/Aredoko.Core/**'
      - 'tools/start-winui.ps1'
      - '.github/workflows/ai-profile-checks.yml'
jobs:
  ai-profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AI preference / profile compatibility tests
        run: python -m unittest discover -s tests -p "test_ai*py" -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core protocol Release checks
        run: dotnet run --project tests/Aredoko.Core.Tests -c Release
      - name: WinUI 3 Release build (not an actual GUI test)
        run: dotnet build src/Aredoko.WinUI/Aredoko.WinUI.csproj -c Release -p:Platform=x64 --nologo
      - name: Parse launcher PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/start-winui.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors -join '; ') }
